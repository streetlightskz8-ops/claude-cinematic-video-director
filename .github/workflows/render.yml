
name: Render Cinematic Video

on:
  repository_dispatch:
    types: [render_video]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install renderer
        working-directory: renderer
        run: npm install

      - name: Prepare job data
        env:
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        run: |
          mkdir -p renderer/public
          python - <<'PY'
          import os, json
          payload = json.loads(os.environ["PAYLOAD_JSON"])
          with open("renderer/public/scenes.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          with open("job.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

      - name: Download voice-over
        run: |
          python -m pip install --quiet gdown
          python - <<'PY'
          import json, re, subprocess
          with open("job.json", encoding="utf-8") as f:
              p = json.load(f)
          m = re.search(r"(?:/d/|id=)([a-zA-Z0-9_-]+)", p["audio_url"])
          if not m:
              raise SystemExit("Link Google Drive tidak valid")
          subprocess.check_call([
              "gdown", "--id", m.group(1),
              "-O", "renderer/public/voiceover.mp3"
          ])
          PY

      - name: Render MP4
        working-directory: renderer
        run: npm run render

      - name: Publish MP4 release
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          TITLE: ${{ github.event.client_payload.title }}
        run: |
          gh release create "video-${JOB_ID}" \
            "renderer/out/video.mp4#${TITLE:-Cinematic Video}" \
            --title "${TITLE:-Cinematic Video}" \
            --notes "Video hasil render otomatis."
