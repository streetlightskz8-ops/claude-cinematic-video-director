
name: Render Cinematic Video

on:
  repository_dispatch:
    types: [render_video]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm install

      - name: Download job payload from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          aws configure set default.region auto
          aws s3 cp "s3://${R2_BUCKET_NAME}/${JOB_ID}.json" job.json \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

      - name: Download voice-over and prepare scenes
        run: |
          python -m pip install --quiet gdown
          python - <<'PY'
          import json, re, subprocess
          with open("job.json", encoding="utf-8") as f:
              p = json.load(f)
          m = re.search(r"[?&]id=([^&]+)", p["audio_url"])
          if not m:
              raise SystemExit("Google Drive audio URL tidak valid")
          subprocess.check_call(["gdown", "--id", m.group(1), "-O", "renderer/public/voiceover.mp3"])
          with open("renderer/public/scenes.json", "w", encoding="utf-8") as f:
              json.dump(p, f, ensure_ascii=False)
          PY

      - name: Render MP4
        working-directory: renderer
        run: npm run render

      - name: Upload MP4 to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          aws configure set default.region auto
          aws s3 cp out/video.mp4 "s3://${R2_BUCKET_NAME}/${JOB_ID}.mp4" \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "video/mp4"
